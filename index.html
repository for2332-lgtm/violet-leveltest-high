<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>OASIS 레벨테스트 · 고등</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet"><style>:root{--deepest:#4D2D7A;--deep:#804CAD;--mid:#C698E0;--soft:#F5EAFA;--gold:#C4955A;--ink:#2B2240;--line:#DCCDED;--boxbg:#F8F5FC;--paper:#EDE6F4;}
html,body{font-family:"Noto Sans KR",sans-serif;color:var(--ink);}
/* ===== Level Test additional styles ===== */
*{box-sizing:border-box;}
body{margin:0;background:linear-gradient(160deg,#F3EEF8 0%,#EDE6F4 100%);min-height:100vh;-webkit-text-size-adjust:100%;}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 60px;}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 22px rgba(77,45,122,.07);padding:22px 20px;margin:14px 0;}
.pill{display:inline-block;background:var(--soft);color:var(--deepest);border:1px solid var(--line);border-radius:999px;padding:4px 13px;font-size:13px;font-weight:700;letter-spacing:.02em;}
.eng-badge{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;color:var(--mid);letter-spacing:.01em;}
.progressbar{height:8px;border-radius:99px;background:#EDE6F4;overflow:hidden;margin:6px 0 2px;}
.progressbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--mid),var(--deep));transition:width .35s;}
h1.brand{font-family:'Cormorant Garamond',serif;font-size:40px;color:var(--deepest);margin:6px 0 2px;letter-spacing:.01em;}
.sub{color:var(--deep);font-size:15px;}
.qtext{font-size:18px;font-weight:700;color:var(--deepest);line-height:1.5;margin:4px 0 14px;word-break:keep-all;}
.passage{font-family:'Cormorant Garamond',serif;font-size:19px;line-height:1.9;color:#2c2340;text-align:justify;word-break:keep-all;background:#FBFAFD;border:1px solid #EEE8F5;border-radius:12px;padding:16px 18px;}
.passage .lead{padding-left:.3em;}
.passage u{text-decoration:none;border-bottom:2px solid var(--gold);padding:0 1px;font-weight:600;color:var(--deepest);}
.passage .num{font-weight:800;color:var(--deep);font-family:'Noto Sans KR';font-size:.9em;}
.blank{display:inline-block;border-bottom:2px solid var(--mid);min-width:8em;text-align:center;color:var(--mid);}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
.choice{display:flex;gap:11px;align-items:flex-start;background:#fff;border:1.6px solid var(--line);border-radius:13px;padding:13px 15px;cursor:pointer;transition:.13s;user-select:none;}
.choice:active{transform:scale(.99);}
.choice .mk{flex:none;width:26px;height:26px;border-radius:50%;border:1.6px solid var(--mid);color:var(--deep);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
.choice .ctext{font-family:'Cormorant Garamond',serif;font-size:18px;line-height:1.5;color:#2c2340;word-break:keep-all;padding-top:1px;}
.choice.sel{border-color:var(--deep);background:var(--soft);box-shadow:0 3px 10px rgba(128,76,173,.13);}
.choice.sel .mk{background:var(--deep);color:#fff;border-color:var(--deep);}
.btn{background:var(--deep);color:#fff;border:none;border-radius:13px;padding:14px 22px;font-size:16px;font-weight:800;cursor:pointer;font-family:'Noto Sans KR';box-shadow:0 4px 14px rgba(128,76,173,.25);}
.btn:active{transform:scale(.98);}
.btn[disabled]{background:#CFC4DD;box-shadow:none;cursor:not-allowed;}
.btn.ghost{background:#fff;color:var(--deep);border:1.6px solid var(--line);box-shadow:none;}
.btnrow{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:18px;}
.tinput{width:100%;border:1.6px solid var(--line);border-radius:12px;padding:13px 15px;font-size:17px;font-family:'Noto Sans KR';color:var(--deepest);}
.tinput:focus{outline:none;border-color:var(--deep);}
/* bank / answer strip (서술형) */
.sublabel{font-size:12.5px;font-weight:800;color:var(--deep);letter-spacing:.08em;text-transform:uppercase;margin:16px 0 7px;}
.bank{display:flex;gap:8px;flex-wrap:wrap;}
.bank .w{background:var(--soft);border:1px solid var(--line);color:var(--deepest);border-radius:9px;padding:8px 13px;font-family:'Cormorant Garamond',serif;font-size:17px;cursor:pointer;user-select:none;transition:.12s;}
.bank .w:active{transform:scale(.94);}
.bank .w.used{background:#F0EDF4;color:#C0B4D0;border-color:#E7E0EE;text-decoration:line-through;}
.answer-strip{min-height:52px;border:1.8px dashed var(--mid);border-radius:13px;padding:11px 12px;display:flex;gap:7px;flex-wrap:wrap;align-items:center;background:#FCFBFE;}
.answer-strip.empty::before{content:'여기에 보기 단어를 탭해서 배치하세요';color:#B6A9C8;font-size:14px;font-family:'Noto Sans KR';}
.tok{background:#fff;border:1.6px solid var(--deep);color:var(--deepest);border-radius:9px;padding:7px 12px;font-family:'Cormorant Garamond',serif;font-size:17px;cursor:pointer;user-select:none;position:relative;}
.tok.changed{border-color:var(--gold);background:#FBF4E9;}
.tok .x{font-size:14px;color:var(--mid);margin-left:7px;padding:0 3px;}
.undo-btn{display:inline-block;margin:8px 0 2px;background:var(--soft);border:1.4px solid var(--deep);color:var(--deepest);border-radius:20px;padding:7px 14px;font-size:13.5px;font-weight:600;cursor:pointer;}
.undo-btn:active{background:#E7D6F5;}
.free-input{width:100%;border:1.6px solid var(--line);border-radius:12px;padding:13px 15px;font-size:18px;font-family:'Cormorant Garamond',serif;color:var(--deepest);}
.tmenu{position:fixed;z-index:50;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(77,45,122,.22);padding:6px;display:flex;flex-direction:column;gap:3px;max-height:60vh;overflow:auto;}
.tmenu button{background:#fff;border:none;border-radius:8px;padding:9px 15px;font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--deepest);text-align:left;cursor:pointer;white-space:nowrap;}
.tmenu button:active{background:var(--soft);}
.tut-step{display:flex;gap:13px;align-items:flex-start;margin:15px 0;}
.tut-step .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--deep);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;}
.tut-step .t{font-size:15.5px;color:#3a2f4d;line-height:1.6;word-break:keep-all;}
.tut-step b{color:var(--deepest);}
.res-row{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid #EFE9F5;}
.ox{font-weight:900;font-size:18px;}
.ox.o{color:#3E9B6B;} .ox.x{color:#C7607A;}
.scorebig{font-family:'Cormorant Garamond',serif;font-size:34px;color:var(--deepest);font-weight:700;}
.mascot{display:block;margin:0 auto;}
.center{text-align:center;}
.dim{color:#8B7EA0;font-size:13.5px;}

function regForms(b){const f=[];f.push(b);
  if(/(s|x|z|ch|sh)$/.test(b))f.push(b+'es');else if(/[^aeiou]y$/.test(b))f.push(b.slice(0,-1)+'ies');else f.push(b+'s');
  if(/e$/.test(b)&&!/ee$/.test(b))f.push(b.slice(0,-1)+'ing');else f.push(b+'ing');
  if(/e$/.test(b))f.push(b+'d');else if(/[^aeiou]y$/.test(b))f.push(b.slice(0,-1)+'ied');else f.push(b+'ed');
  f.push('to '+b);
  if(/[^aeiou]y$/.test(b))f.push(b.slice(0,-1)+'ier');else if(/e$/.test(b))f.push(b+'r');else f.push(b+'er');
  return f;
}
function lemmas(w){const cand=new Set([w]);const add=x=>{if(x&&x.length>1)cand.add(x);};
  if(w.endsWith('ing')){add(w.slice(0,-3));add(w.slice(0,-3)+'e');}
  if(w.endsWith('ied')){add(w.slice(0,-3)+'y');}else if(w.endsWith('ed')){add(w.slice(0,-2));add(w.slice(0,-1));}
  if(w.endsWith('ies')){add(w.slice(0,-3)+'y');}else if(w.endsWith('es')){add(w.slice(0,-2));add(w.slice(0,-1));}else if(w.endsWith('s')&&!w.endsWith('ss')){add(w.slice(0,-1));}
  // NOTE: no -er/-est stripping — bank words are base forms; stripping made bogus stems (volunteer->volunte)
  const valid=[...cand].filter(b=> b===w || (IRREG[b]&&IRREG[b].includes(w)) || regForms(b).includes(w));
  return valid.length?valid:[w];
}
function variantForms(word){
  const w=word.toLowerCase().trim();
  const extra=FORM_EXTRA[w]||[];
  if(w.includes(' ')) { const m=[word]; extra.forEach(x=>{if(!m.includes(x))m.push(x);}); return m; }
  // primary: forms from the word itself (the common, relevant inflections)
  const primary=[];
  if(IRREG[w]){ IRREG[w].forEach(x=>primary.push(x)); primary.push('to '+w); }
  else regForms(w).forEach(x=>primary.push(x));
  // secondary: forms from stripped lemmas (for already-inflected bank words, e.g. working->works)
  const secondary=[];
  lemmas(w).forEach(b=>{ if(b===w) return; if(IRREG[b]){ IRREG[b].forEach(x=>secondary.push(x)); secondary.push('to '+b); } else { regForms(b).forEach(x=>secondary.push(x)); } });
  const menu=[word]; const push=x=>{ if(x && !menu.includes(x)) menu.push(x); };
  extra.forEach(push);                                                    // guaranteed overrides
  primary.sort((a,b)=>a.length-b.length).forEach(x=>{ if(menu.length<8) push(x); });
  secondary.sort((a,b)=>a.length-b.length).forEach(x=>{ if(menu.length<9) push(x); });
  return menu;
}
function isCorrect(p, raw){const n=norm(raw);if(!n)return false;if(p.accept&&p.accept.some(a=>norm(a)===n))return true;if(p.requireAll&&p.requireAll.every(ph=>n.includes(norm(ph))))return true;return false;}

      <span class="dim">${esc(S.name)}</span>
    </div>
    <div class="progressbar" style="margin-top:10px"><i style="width:${pct}%"></i></div>
  </div>`;
}

function grammar(){
  const q=G[S.gIdx]; const sel=S.g[q.id]||[];
  const need = q.selectCount===0 ? '정답을 모두 고르세요' : (q.selectCount===2?'2개를 고르세요':'하나를 고르세요');
  let ch='';
  q.choices.forEach((c,i)=>{
    ch+=`<div class="choice${sel.includes(i)?' sel':''}" data-i="${i}"><div class="mk">${MK[i]}</div><div class="ctext">${c}</div></div>`;
  });
  app.innerHTML=`<div class="wrap">
    ${headerBar('g',S.gIdx,G.length)}
    <div class="card">
      <div class="qtext">${q.prompt}</div>
      <div class="dim" style="margin:-8px 0 10px">· ${need}</div>
      ${q.passage?`<div class="passage">${q.passage}</div>`:''}
      <div class="choices">${ch}</div>
      <div class="btnrow">
        <button class="btn ghost" id="prev">이전</button>
        <button class="btn" id="next" disabled>다음</button>
      </div>
    </div></div>`;
  const refresh=()=>{
    [...app.querySelectorAll('.choice')].forEach(el=>{
      const i=+el.dataset.i; el.classList.toggle('sel',(S.g[q.id]||[]).includes(i));
    });
    const s=S.g[q.id]||[]; const ok=q.selectCount===0?s.length>=1:(q.selectCount===2?s.length===2:s.length===1);
    document.getElementById('next').disabled=!ok;
  };
  [...app.querySelectorAll('.choice')].forEach(el=>{
    el.onclick=()=>{
      const i=+el.dataset.i; let s=(S.g[q.id]||[]).slice();
      if(q.selectCount===1){ s=[i]; }
      else if(q.selectCount===2){ if(s.includes(i)) s=s.filter(x=>x!==i); else if(s.length<2) s.push(i); else s=[s[1],i]; }
      else { if(s.includes(i)) s=s.filter(x=>x!==i); else s.push(i); }
      S.g[q.id]=s; save(); refresh();
    };
  });
  document.getElementById('prev').onclick=()=>{ if(S.gIdx>0){S.gIdx--;save();render();} else {S.phase='intro';save();render();} };
  document.getElementById('next').onclick=()=>{
    if(S.gIdx<G.length-1){ S.gIdx++; } else { S.phase='tutorial'; }
    save(); render();
  };
  refresh();
}

function tutorial(){
  app.innerHTML=`<div class="wrap"><div class="card">
    <div class="center"><img class="mascot" src="${sticker('a_00')}" width="112" alt=""></div>
    <h1 class="brand center" style="font-size:30px">이제 서술형이에요!</h1>
    <p class="center sub" style="margin-top:2px">타이핑 없이, 보기 단어를 <b>탭</b>해서 문장을 만들어요.</p>
    <div style="margin-top:8px">
      <div class="tut-step"><div class="n">1</div><div class="t"><b>보기 단어를 한 번 탭</b>하면 아래 답안 칸에 배치돼요.</div></div>
      <div class="tut-step"><div class="n">2</div><div class="t">배치된 단어를 <b>한 번 더 탭</b>하면 다시 빼낼 수 있어요.</div></div>
      <div class="tut-step"><div class="n">3</div><div class="t">단어 형태를 바꿔야 할 땐 배치된 단어를 <b>두 번 빠르게 탭</b>하거나 <b>2초간 꾹</b> 누르세요. 변형 메뉴가 떠요.<br><span class="dim">예) study → studies · studying · studied / create → creative</span></div></div>
      <div class="tut-step"><div class="n">4</div><div class="t">문맥과 어법에 맞게 배열·변형한 뒤 <b>제출</b>을 누르면 다음 문제로 넘어가요.</div></div>
    </div>
    <div class="btnrow"><span class="dim">천천히, 아는 만큼만 풀면 돼요 :)</span><button class="btn" id="go">서술형 시작</button></div>
  </div></div>`;
  document.getElementById('go').onclick=()=>{ S.phase='seosul'; S.sIdx=0; save(); render(); };
}

/* ---------- 서술형 tap-place ---------- */
let tmenuEl=null;
function closeMenu(){ if(tmenuEl){tmenuEl.remove();tmenuEl=null;} }
document.addEventListener('click',e=>{ if(tmenuEl && !tmenuEl.contains(e.target)) closeMenu(); },true);

function seosul(){
  closeMenu();
  const q=SE[S.sIdx];
  const st=S.s[q.id]||(S.s[q.id]={placed:[],used:{},free:'',submitted:false});
  const isFree=!q.bank||!q.bank.length;
  let body='';
  if(q.summary) body+=`<div class="passage" style="margin-bottom:10px">${q.passage}</div><div class="qtext" style="font-family:'Cormorant Garamond',serif;font-weight:600">${q.summary}</div>`;
  else body+=`<div class="passage">${q.passage}</div>`;
  if(q.conds&&q.conds.length){ body+=`<div class="dim" style="margin-top:10px">${q.conds.map(c=>'· '+c).join('<br>')}</div>`; }

  if(isFree){
    body+=`<div class="sublabel">직접 입력</div><input class="free-input" id="finp" placeholder="여기에 답을 입력하세요" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" writingsuggestions="false" value="${esc(st.free||'')}">`;
  }else{
    const bank=q.bank.map((w,bi)=>`<span class="w${st.used[bi]?' used':''}" data-bi="${bi}">${esc(w)}</span>`).join('');
    const toks=st.placed.map((t,ti)=>`<span class="tok${t.changed?' changed':''}" data-ti="${ti}">${esc(t.text)}<span class="x">✕</span></span>`).join('');
    const undoBtn = st.undo ? `<div><button class="undo-btn" id="undoBtn">↩︎ 방금 지운 &lsquo;${esc(st.undo.t.text)}&rsquo; 되돌리기</button></div>` : '';
    body+=`<div class="sublabel">내 답안 · Answer</div><div class="answer-strip${st.placed.length?'':' empty'}" id="strip">${toks}</div>${undoBtn}
    <div class="sublabel">보기 · Word Bank</div><div class="bank" id="bank">${bank}</div>`;
  }
  app.innerHTML=`<div class="wrap">
    ${headerBar('s',S.sIdx,SE.length)}
    <div class="card">
      
      <div class="qtext">${q.instr}</div>
      ${body}
      <div class="btnrow"><button class="btn ghost" id="prev">이전</button><button class="btn" id="submit">제출</button></div>
    </div></div>`;

  if(isFree){
    const fi=document.getElementById('finp'); fi.oninput=()=>{ st.free=fi.value; save(); };
  }else{
    wireBank(q,st);
  }
  document.getElementById('prev').onclick=()=>{ if(S.sIdx>0){S.sIdx--;save();render();} else {S.phase='tutorial';save();render();} };
  document.getElementById('submit').onclick=()=>{
    const raw = isFree ? (st.free||'') : st.placed.map(t=>t.text).join(' ').trim();
    st.raw=raw; st.correct=isCorrect(q,raw); st.submitted=true; save();
    if(S.sIdx<SE.length-1){ S.sIdx++; S.phase='seosul'; } else { S.phase='done'; }
    save(); render();
  };
}

function wireBank(q,st){
  [...app.querySelectorAll('#bank .w')].forEach(el=>{
    el.onclick=()=>{ const bi=+el.dataset.bi; if(st.used[bi])return; st.used[bi]=true; st.placed.push({text:q.bank[bi],base:q.bank[bi],bankIdx:bi,changed:false}); st.undo=null; save(); seosul(); };
  });
  [...app.querySelectorAll('#strip .tok')].forEach(el=>{
    const ti=+el.dataset.ti; let clicks=0,timer=null,lp=null,moved=false;
    const removeTok=()=>{ if(PINCH)return; const t=st.placed[ti]; if(!t)return; if(t.bankIdx!=null) st.used[t.bankIdx]=false; st.placed.splice(ti,1); st.undo={ti,t}; save(); seosul(); };
    const openMenu=()=>{ if(PINCH)return; clicks=0; showTransform(el,q,st,ti); };
    el.addEventListener('pointerdown',ev=>{ moved=false; lp=setTimeout(()=>{lp=null;openMenu();},450); });
    el.addEventListener('pointermove',()=>{ moved=true; if(lp){clearTimeout(lp);lp=null;} });
    el.addEventListener('pointerup',()=>{ if(lp){clearTimeout(lp);lp=null;} });
    el.addEventListener('click',ev=>{ if(moved||PINCH)return; clicks++; if(clicks===1){ timer=setTimeout(()=>{ if(clicks===1) removeTok(); clicks=0; },260); } else { clearTimeout(timer); openMenu(); } });
  });
  const ub=document.getElementById('undoBtn');
  if(ub) ub.onclick=()=>{ const u=st.undo; if(!u)return; const at=Math.min(Math.max(u.ti,0),st.placed.length); st.placed.splice(at,0,u.t); if(u.t.bankIdx!=null) st.used[u.t.bankIdx]=true; st.undo=null; save(); seosul(); };
}

function showTransform(el,q,st,ti){
  closeMenu();
  const base=st.placed[ti].base;
  let opts=[]; try{ opts=variantForms(base); }catch(e){ opts=[base]; }
  if(!opts.length) opts=[base];
  const m=document.createElement('div'); m.className='tmenu';
  opts.slice(0,12).forEach(o=>{ const b=document.createElement('button'); b.textContent=o; b.onclick=()=>{ st.placed[ti].text=o; st.placed[ti].changed=(o!==base); st.undo=null; save(); closeMenu(); seosul(); }; m.appendChild(b); });
  document.body.appendChild(m);
  const r=el.getBoundingClientRect(); let x=r.left, y=r.bottom+6;
  const mw=m.offsetWidth, mh=m.offsetHeight;
  if(x+mw>window.innerWidth-8) x=window.innerWidth-mw-8;
  if(y+mh>window.innerHeight-8) y=r.top-mh-6;
  m.style.left=Math.max(8,x)+'px'; m.style.top=Math.max(8,y)+'px';
  tmenuEl=m;
}

function done(){
  app.innerHTML=`<div class="wrap"><div class="card center">
    <img class="mascot" src="${sticker('b_14')}" width="128" alt="">
    <h1 class="brand" style="font-size:32px">제출 완료!</h1>
    <p class="sub">${esc(S.name)} 학생, 수고했어요 😊<br>이제 태블릿을 선생님께 전달해 주세요.</p>
    <div style="margin-top:20px"><button class="btn ghost" id="tcheck">선생님 확인</button></div>
    <div class="dim" style="margin-top:22px">다시 풀고 싶다면 선생님께 말씀해 주세요.</div>
  </div></div>`;
  document.getElementById('tcheck').onclick=()=>{
    const pw=prompt('선생님 확인 비밀번호를 입력하세요.');
    if(pw===PW){ S.phase='result'; save(); render(); }
    else if(pw!=null){ alert('비밀번호가 올바르지 않습니다.'); }
  };
}

function result(){
  let gc=0; G.forEach(q=>{ if(setEq(S.g[q.id]||[], q.answer)) gc++; });
  let sc=0; SE.forEach(q=>{ if(S.s[q.id]&&S.s[q.id].correct) sc++; });
  const total=gc+sc, tmax=G.length+SE.length;
  let grows=G.map((q,i)=>{ const ok=setEq(S.g[q.id]||[],q.answer); const sel=(S.g[q.id]||[]).map(x=>MK[x]).join('')||'—'; const ans=q.answer.map(x=>MK[x]).join('');
     return `<div class="res-row"><span>문법 ${i+1} <span class="dim">· 선택 ${sel} / 정답 ${ans}</span></span><span class="ox ${ok?'o':'x'}">${ok?'O':'X'}</span></div>`; }).join('');
  let srows=SE.map((q,i)=>{ const st=S.s[q.id]||{}; const ok=!!st.correct;
     return `<div class="res-row"><span>서술형 ${i+1} <span class="dim">· ${esc((st.raw||'—')).slice(0,60)}</span></span><span class="ox ${ok?'o':'x'}">${ok?'O':'X'}</span></div>`; }).join('');
  app.innerHTML=`<div class="wrap">
    <div class="card center">
      <div class="pill">선생님 확인 화면</div>
      <h1 class="brand" style="font-size:30px;margin-top:8px">${esc(S.name)} · ${esc(DATA.level)}</h1>
      <div style="display:flex;gap:26px;justify-content:center;margin:10px 0 4px">
        <div><div class="dim">문법</div><div class="scorebig">${gc}<span style="font-size:20px;color:#B6A9C8"> / ${G.length}</span></div></div>
        <div><div class="dim">서술형</div><div class="scorebig">${sc}<span style="font-size:20px;color:#B6A9C8"> / ${SE.length}</span></div></div>
        <div><div class="dim">총점</div><div class="scorebig" style="color:var(--deep)">${total}<span style="font-size:20px;color:#B6A9C8"> / ${tmax}</span></div></div>
      </div>
    </div>
    <div class="card"><div class="sublabel">문항별 채점</div>${grows}${srows}</div>
    <div class="card center">
      <button class="btn" id="newstu">다음 학생 (초기화)</button>
      <div class="dim" style="margin-top:10px">이 화면은 학생에게 보이지 않도록 확인 후 닫아주세요.</div>
    </div></div>`;
  document.getElementById('newstu').onclick=()=>{
    if(confirm('현재 학생의 답안을 지우고 새 학생을 시작할까요?')){ S={phase:'intro',name:'',gIdx:0,sIdx:0,g:{},s:{}}; save(); render(); }
  };
}

render();

</script></body></html>
